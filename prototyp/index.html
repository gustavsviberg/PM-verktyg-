<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Projektledarverktyget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: en arbetsyta. Fast toppfält med projektval, under det flikar per etapp och en bred innehållsyta. Guiden för nytt projekt tar över ytan steg för steg. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8ECEE; --ink:#15222B; --muted:#5A6A74; --line:#D6DDE1;
  --accent:#1D5C86; --accent-soft:#E3EEF5; --on-accent:#FFFFFF;
  --warn:#9A5B00; --warn-bg:#FFF2DB; --warn-line:#F0C77A;
  --ok:#256B43; --ok-bg:#E3F2E9; --danger:#B3261E; --danger-bg:#FBE9E7;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161B; --surface:#152028; --sunk:#1B2832; --ink:#E4ECF0; --muted:#94A5AF; --line:#2A3A44;
  --accent:#70B4E2; --accent-soft:#1B3445; --on-accent:#0E161B;
  --warn:#F2B860; --warn-bg:#352812; --warn-line:#6B5020;
  --ok:#76D29E; --ok-bg:#15301F; --danger:#F28A82; --danger-bg:#3A1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#152028; --sunk:#1B2832; --ink:#E4ECF0; --muted:#94A5AF; --line:#2A3A44;
  --accent:#70B4E2; --accent-soft:#1B3445; --on-accent:#0E161B;
  --warn:#F2B860; --warn-bg:#352812; --warn-line:#6B5020;
  --ok:#76D29E; --ok-bg:#15301F; --danger:#F28A82; --danger-bg:#3A1A18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:24px;line-height:1.2}
h2{font-size:18px}
h3{font-size:15px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}

/* Toppfält */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.brand svg{flex:none}
.picker{display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:0}
.picker select{flex:1;min-width:0;max-width:460px}
.store{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
select{padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12.5px}

/* Flikar */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:4px}
.tab{padding:10px 14px;border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:disabled{cursor:default;opacity:.55}
.tab small{font-size:10.5px;margin-left:4px;letter-spacing:.03em}

main{padding-block:20px 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>.bd{padding:16px}
.stack{display:grid;gap:16px}
.stack>*,main>*{min-width:0}
[hidden]{display:none!important}

/* Projekthuvud */
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.phead .t{min-width:0;flex:1 1 360px}
.phead .eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 24px}
.meta div{min-width:0}
.meta .v{font-weight:500;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}

/* Tabeller */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface);white-space:nowrap}
tr.phase td{background:var(--sunk);font-weight:600}
tr.sum td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
tr.flag td{background:var(--warn-bg)}
td input,td select{width:100%;padding:5px 7px}
td input.n{text-align:right;font-variant-numeric:tabular-nums}
td.code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Guide */
.steps{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px}
.step{display:flex;align-items:center;gap:7px;color:var(--muted)}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:11.5px;font-weight:600}
.step.on{color:var(--ink);font-weight:600}
.step.on b{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.step.done b{border-color:var(--ok);color:var(--ok)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;background:var(--bg);transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin-bottom:4px}
.formats{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ex{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);cursor:pointer}
.ex:hover{border-color:var(--accent)}
.ex .ic{flex:none;width:34px;height:40px;border-radius:4px;display:grid;place-items:center;font:600 10px var(--f-mono);color:var(--on-accent);background:var(--accent)}
.ex .ic.x{background:var(--ok)}
.ex div{min-width:0}
.reading{display:grid;gap:14px;justify-items:center;text-align:center;padding:40px 16px}
.bar{width:min(420px,100%);height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:35%;background:var(--accent);border-radius:3px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:60%}}
.stream{max-width:640px;width:100%;max-height:120px;overflow:hidden;font:12px/1.45 var(--f-mono);color:var(--muted);text-align:left;white-space:pre-wrap;mask-image:linear-gradient(transparent,#000 40%)}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 18px}
.field{display:grid;gap:4px;min-width:0}
.field>input,.field>select{width:100%}
.field.unsure>input,.field.unsure>select{border-color:var(--warn-line);background:var(--warn-bg)}
.fl{display:flex;align-items:center;gap:6px;justify-content:space-between}
.why{font-size:12px;color:var(--warn)}
.flagbtn{border:0;cursor:pointer;font:inherit}
.q{border:1.5px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.q.answered{border-color:var(--line);background:var(--surface)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;font-size:13px}
.check.ok{background:var(--ok-bg);color:var(--ok)}
.check.warn{background:var(--warn-bg);color:var(--warn)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.foot .grow{margin-right:auto;font-size:13px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.notice.warn{background:var(--warn-bg)}
.list{margin:0;padding-left:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols>*{min-width:0}
.empty{padding:56px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-bg);color:var(--danger);padding:8px 12px;border-radius:8px;font-size:13px}
.err{color:var(--danger)}
@media (max-width:560px){h1{font-size:20px}.store span{display:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="3" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="7" width="8" height="2.6" rx="1" fill="var(--accent)"/><rect x="8" y="11" width="9" height="2.6" rx="1" fill="var(--accent)"/><path d="M15 3v16" stroke="var(--danger)" stroke-width="1.4"/></svg>
      Projektledarverktyget
    </div>
    <div class="picker">
      <label for="projSel" class="label" style="white-space:nowrap">Projekt</label>
      <select id="projSel" aria-label="Välj projekt"></select>
      <button class="btn primary" id="newBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Nytt projekt
      </button>
    </div>
    <div class="store" id="store"><i class="dot"></i><span>Hämtar projekt…</span></div>
  </div>
  <div class="wrap">
    <nav class="tabs" role="tablist" aria-label="Vyer">
      <button class="tab" role="tab" aria-selected="true">Översikt</button>
      <button class="tab" role="tab" disabled>Budget<small>etapp 2</small></button>
      <button class="tab" role="tab" disabled>Timmar<small>etapp 3</small></button>
      <button class="tab" role="tab" disabled>Prognos<small>etapp 3</small></button>
      <button class="tab" role="tab" disabled>Tidplan<small>etapp 4</small></button>
      <button class="tab" role="tab" disabled>Export<small>etapp 5</small></button>
      <button class="tab" role="tab" disabled>Delning<small>etapp 6</small></button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<input type="file" id="fileIn" accept=".pdf,.docx,.xlsx,.xls,.csv,.txt" hidden>

<script>
const EXEMPEL = {
 "A": {
  "filnamn": "Exempelanbud_Ekbackens_forskola.docx",
  "text": "Anbud – Konstruktionsprojektering, nybyggnad Ekbackens förskola\nAnbud A-2026-114\nAnbudsdatum: 2026-10-20\nTill: Lindvik kommun, Fastighetsavdelningen\nAvser: Konstruktionsprojektering, nybyggnad Ekbackens förskola\nVi tackar för förfrågan och lämnar härmed anbud på konstruktionsprojektering för nybyggnad av Ekbackens förskola, två plan med stomme i KL-trä och grundläggning på platta på mark.\nUppdraget planeras att starta 2026-11-16 och avslutas 2027-08-31 i och med överlämnade relationshandlingar.\nTimpriser\nRoll | Timpris (kr/h)\nUppdragsledare | 1 250\nKonstruktör | 1 050\nHandläggare/ritare | 900\nBIM-samordnare | 1 000\nArbetsmoment och leveranser\nKod | Moment | Roll | Timmar | Belopp (kr)\nFas 1 – Utredning |  |  |  | \n1.1 | Startmöte och inventering av befintligt underlag | Uppdragsledare | 12 | 15 000\n1.2 | Förstudie stomval | Konstruktör | 40 | 42 000\nFas 2 – Systemhandling |  |  |  | \n2.1 | Systemhandling konstruktion | Konstruktör | 120 | 126 000\n2.2 | Projekteringsmöten (12 st) | Uppdragsledare | 36 | 45 000\nFas 3 – Bygghandling |  |  |  | \n3.1 | Bygghandling stomme och grund | Konstruktör | 220 | 231 000\n3.2 | Ritningsproduktion | Handläggare/ritare | 180 | 162 000\n3.3 | BIM-samordning och kollisionskontroll | BIM-samordnare | 70 | 70 000\n3.4 | Egenkontroll och granskning | Uppdragsledare | 16 | 20 000\nFas 4 – Byggskede |  |  |  | \n4.1 | Medverkan i byggskede, byggplatsbesök | Konstruktör | 48 | 50 400\n4.2 | Relationshandlingar | Handläggare/ritare | 30 | 27 000\n | Summa |  | 772 | 788 400\nArvode och villkor\nUppdraget utförs till fast arvode om 788 400 kr exklusive moms, enligt ABK 09.\nReserv för oförutsett: 5 % (39 420 kr). Reserven ingår inte i det fasta arvodet och avropas efter beställarens skriftliga godkännande.\nÁ-priser: Tillkommande projekteringsmöte utöver 12 st debiteras med 4 500 kr/st. Tilläggsarbeten (ÄTA) debiteras enligt timpriserna ovan.\nFakturering sker månadsvis i takt med upparbetning. Betalningsvillkor 30 dagar.\nMed vänlig hälsning\nKarin Ström, Uppdragsledare, Stomkonsult Norr AB"
 },
 "B": {
  "filnamn": "Exempelanbud_Dagvatten_Norra_hamnen.xlsx",
  "text": "Anbud | Dagvattenutredning Norra hamnen\nBeställare | Säterö Hamn AB\nAnbudsnummer | 2026-0871\nAnbudsdatum | 2026-10-12\nPeriod | 2026-12-01 – 2027-04-30\nRoll | Timpris (kr/h)\nUppdragsledare | 1300\nUtredare | 1080\nGIS-ingenjör | 980\nNr | Moment | Roll | Timmar | Belopp (kr)\n1 | Insamling av underlag | Utredare | 24 | 25920\n2 | Platsbesök och inmätning | GIS-ingenjör | 32 | 31360\n3 | Hydraulisk modellering | Utredare | 90 | 97200\n4 | Åtgärdsförslag | Utredare | 40 | 43200\n5 | Rapport och presentation | Uppdragsledare | 28 | 36400\n6 | Möten med beställaren | Uppdragsledare | 12 | 15600\n | Bedömd kostnad |  | 226 | 249680\nVillkor | Ersättning enligt ABK 09. Utskrift av rapport á 650 kr/st."
 }
};

// ---------- Hjälpfunktioner ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kr = n => (n == null || isNaN(n)) ? "–" : Math.round(n).toLocaleString("sv-SE") + " kr";
const tal = n => (n == null || isNaN(n)) ? "–" : (+n).toLocaleString("sv-SE", { maximumFractionDigits: 1 });
const num = v => { if (v == null || v === "") return null; if (typeof v === "number") return v; const s = String(v).replace(/[\s ]/g, "").replace(/kr.*$/i, "").replace(",", "."); const n = parseFloat(s); return isNaN(n) ? null : n; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const iso = s => { const m = String(s ?? "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : ""; };
const datum = s => s ? new Date(s + "T12:00:00").toLocaleDateString("sv-SE", { day: "numeric", month: "short", year: "numeric" }) : "–";
const FORM = { fast: "Fast pris", rorligt: "Löpande räkning" };
const STATUS = ["Anbud", "Pågående", "Vilande", "Avslutat"];
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3800); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Kunde inte ladda " + src)); document.head.append(s); }); }

// ---------- Lagring: molnet (db) med webbläsaren som reserv ----------
const store = {
  mode: "väntar", projects: [], db: null, me: null,
  async init() {
    const fallback = () => { this.mode = "lokal"; this.projects = lsGet("pmv.projekt", []); renderStore(); render(); };
    if (!window.claude?.use) return fallback();
    try {
      const db = await window.claude.use("db");
      if (!db) return fallback();
      this.db = db; this.mode = "moln";
      claude.use("user").then(u => u?.id?.().then(id => this.me = id).catch(() => {})).catch(() => {});
      db.collection("projects").onSnapshot(snap => {
        this.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderStore(); render();
      }, e => { this.mode = "fel"; this.err = e?.message; renderStore(); });
    } catch { fallback(); }
  },
  async save(p) {
    p.uppdaterad = new Date().toISOString();
    if (this.mode === "moln") { await this.db.collection("projects").doc(p.id).set(JSON.parse(JSON.stringify(p))); }
    else { const i = this.projects.findIndex(x => x.id === p.id); i >= 0 ? this.projects[i] = p : this.projects.push(p); lsSet("pmv.projekt", this.projects); render(); }
  },
  async remove(id) {
    if (this.mode === "moln") await this.db.collection("projects").doc(id).delete();
    else { this.projects = this.projects.filter(p => p.id !== id); lsSet("pmv.projekt", this.projects); render(); }
  }
};
function renderStore() {
  const el = $("#store");
  const m = { moln: ["ok", "Sparas i molnet"], lokal: ["warn", "Sparas bara i den här webbläsaren"], fel: ["warn", "Kunde inte nå lagringen"], "väntar": ["", "Hämtar projekt…"] }[store.mode];

function wireDrop() {
  const d = $("#drop"), fi = $("#fileIn");
  d.onclick = () => fi.click();
  d.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fi.click(); } };
  fi.onchange = () => { if (fi.files[0]) handleFile(fi.files[0]); fi.value = ""; };
  ["dragenter", "dragover"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
}

async function handleFile(file) {

    await interpret(text, file.name);

// ---------- Textutvinning ----------
async function extractText(file) {
  const name = file.name.toLowerCase(), buf = await file.arrayBuffer();
  if (name.endsWith(".pdf")) {
    setStatus("Läser PDF…");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const out = [];
    for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      const rows = [];
      tc.items.filter(it => it.str.trim()).forEach(it => {
        const y = it.transform[5], x = it.transform[4];
        let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) { r = { y, items: [] }; rows.push(r); }
        r.items.push({ x, w: it.width, s: it.str });
      });
      rows.sort((a, b) => b.y - a.y).forEach(r => {
        r.items.sort((a, b) => a.x - b.x); let line = "", end = null;
        r.items.forEach(it => { line += end == null ? it.s : (it.x - end > 12 ? " | " : (it.x - end > 1 ? " " : "")) + it.s; end = it.x + it.w; });
        out.push(line);
      });
    }
    return out.join("\n");
  }
  if (name.endsWith(".docx")) {
    setStatus("Läser Word-dokument…");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const { value } = await mammoth.convertToHtml({ arrayBuffer: buf });
    const doc = new DOMParser().parseFromString(value, "text/html"); const out = [];
    doc.body.childNodes.forEach(n => {
      if (n.nodeName === "TABLE") n.querySelectorAll("tr").forEach(tr => out.push([...tr.children].map(c => c.textContent.trim()).join(" | ")));
      else if (n.textContent.trim()) out.push(n.textContent.trim());
    });
    return out.join("\n");
  }
  if (/\.(xlsx|xls|csv)$/.test(name)) {
    setStatus("Läser kalkylblad…");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
    return wb.SheetNames.map(n => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false, defval: "" });
      return (wb.SheetNames.length > 1 ? `Flik: ${n}\n` : "") + rows.map(r => { const c = r.map(v => String(v).trim()); while (c.length && !c[c.length - 1]) c.pop(); return c.join(" | "); }).filter(Boolean).join("\n");
    }).join("\n\n");
  }
  if (name.endsWith(".txt")) return new TextDecoder().decode(buf);
  if (name.endsWith(".doc")) throw new Error("Äldre Word-filer (.doc) kan inte läsas. Spara om anbudet som .docx eller PDF och försök igen.");
  throw new Error("Filtypen stöds inte. Använd PDF, Word (.docx), Excel (.xlsx) eller CSV.");
}

const PROMPT = text => `Du läser ett anbud för ett konsult- eller bygguppdrag i Sverige och ska ta fram underlag för att skapa ett projekt i ett projektledarverktyg.
Svara ENDAST med JSON enligt schemat nedan, utan förklarande text. Belopp i kronor som tal (utan mellanslag), timmar som tal, datum som ÅÅÅÅ-MM-DD.
Varje fält i "falt" har formen {"varde": ..., "osaker": true|false, "kommentar": "kort förklaring på svenska om varför det är osäkert, annars tom"}.
Markera osaker=true när värdet är gissat, härlett, motsägelsefullt eller saknas. Hitta aldrig på värden: sätt varde till null om uppgiften saknas.

Regler:
- uppdragsnamn: uppdragets namn så som det beskrivs i anbudet, lämpligt som projektnamn.
- uppdragsnummer: anbudets eller uppdragets nummer om det finns. Markera alltid osaker=true med kommentaren att det kan behöva bytas mot ert interna uppdragsnummer.

- totalsumma: anbudets totala summa exklusive moms.
- tasks: alla arbetsmoment och leveranser med timmar. "fas" är fasens eller rubrikens namn (null om faser saknas). "roll" ska matcha ett namn i "roller" om möjligt. "kostnad" som anbudet anger för momentet.
- reserver: reserver eller oförutsett, med "ingar": true om beloppet ingår i totalsumman.
- apriser: á-priser och styckpriser.
- anteckningar: korta noteringar om annat projektledaren bör känna till (villkor, avvikelser, motsägelser i summor).

Schema:
{"falt":{"uppdragsnamn":F,"uppdragsnummer":F,"bestallare":F,"anbudsdatum":F,"startdatum":F,"slutdatum":F,"ersattningsform":F,"totalsumma":F},

  if (sel) { const el = a.id ? document.getElementById(a.id) : $(sel); if (el) { el.focus({ preventScroll: true }); try { if (pos != null) el.setSelectionRange(pos, pos); } catch {} } }
}

async function createProject() {
  const w = ui.wiz, d = w.draft, f = d.falt;
  const p = {
    id: uid(), namn: (f.uppdragsnamn.varde || "").trim(), uppdragsnummer: (f.uppdragsnummer.varde || "").trim(), bestallare: (f.bestallare.varde || "").trim(),
    ersattningsform: f.ersattningsform.varde, startdatum: iso(f.startdatum.varde), slutdatum: iso(f.slutdatum.varde), status: "Anbud",
    anbud: { filnamn: d.filnamn, anbudsnummer: f.uppdragsnummer.varde || "", anbudsdatum: iso(f.anbudsdatum.varde), totalsumma: num(f.totalsumma.varde), tolkning: d.kalla },
    roller: d.roller.filter(r => r.namn).map(r => ({ id: uid(), namn: r.namn, timpris: num(r.timpris) })),
    tasks: d.tasks.filter(t => t.namn || t.kod).map(t => ({ id: t.id || uid(), kod: t.kod || "", fas: t.fas || "", namn: t.namn || t.kod, roll: t.roll || "", timmar: num(t.timmar) || 0, timpris: num(t.timpris) || 0 })),
    apriser: d.apriser, reserver: d.reserver, anteckningar: d.anteckningar,
    skapad: new Date().toISOString(), skapadAv: store.me || null, skapadPaSek: Math.round((Date.now() - w.start) / 1000)
  };
  const btn = $("#createBtn"); btn.disabled = true; btn.textContent = "Sparar…";
  try {
    await store.save(p);
    const t = elapsed(); clearInterval(ui.tick);
    ui.selected = p.id; lsSet("pmv.valt", p.id); ui.view = "projekt"; ui.wiz = null; render();
    toast(`”${p.namn}” är skapat på ${t} min`);
  } catch (err) { btn.disabled = false; btn.textContent = "Skapa projekt"; toast("Kunde inte spara: " + (err?.message || err)); }
}
